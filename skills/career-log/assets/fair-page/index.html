<title>Career fair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first event-signage tool. Sticky tab bar, one panel at a time; booth numbers set like hall signage. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#13212a; --muted:#566771; --line:#d3dce1; --accent:#0a6a86;
  --s:#0d7a4c; --a:#2a5db5; --on:#7556a3; --b:#a8711a; --out:#97a3ab;
  --s-soft:#dff2e9; --a-soft:#e2eafb; --on-soft:#ece6f6; --b-soft:#f7ecd8; --out-soft:#eceff1;
  --rv-pl:#b0367a; --rv-be:#0a6a86;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --done:.42;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#16222a; --ink:#e3ebef; --muted:#93a5af; --line:#2a3a44; --accent:#5cc0dc;
  --s:#4fcf93; --a:#7fa6ff; --on:#b79af0; --b:#e2ac52; --out:#6c7b84;
  --s-soft:#163628; --a-soft:#1c2a47; --on-soft:#2a2240; --b-soft:#3a2c14; --out-soft:#1f2b32; --rv-pl:#f08cc0; --rv-be:#5cc0dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#16222a; --ink:#e3ebef; --muted:#93a5af; --line:#2a3a44; --accent:#5cc0dc;
  --s:#4fcf93; --a:#7fa6ff; --on:#b79af0; --b:#e2ac52; --out:#6c7b84;
  --s-soft:#163628; --a-soft:#1c2a47; --on-soft:#2a2240; --b-soft:#3a2c14; --out-soft:#1f2b32; --rv-pl:#f08cc0; --rv-be:#5cc0dc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{padding-block:18px 10px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 16px var(--display);letter-spacing:.04em;padding:9px 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:18px;padding-top:16px}
h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;letter-spacing:.02em}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.group{display:grid;gap:10px}
.callout{border-left:3px solid var(--accent);background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:600 15px var(--display);padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.steps li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.time{font:600 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.stepname{min-width:0}
.stepname b{font-weight:600}
.booth{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:6px;font:700 16px var(--display);font-variant-numeric:tabular-nums;color:#fff;background:var(--out);margin-right:6px;vertical-align:middle}
.t-S{background:var(--s)}.t-A{background:var(--a)}.t-ON{background:var(--on)}.t-B{background:var(--b)}.t-X{background:var(--out)}
.chip{display:inline-block;font:600 12px var(--display);letter-spacing:.06em;padding:2px 8px;border-radius:99px;vertical-align:middle}
.c-S{background:var(--s-soft);color:var(--s)}.c-A{background:var(--a-soft);color:var(--a)}.c-ON{background:var(--on-soft);color:var(--on)}.c-B{background:var(--b-soft);color:var(--b)}.c-X{background:var(--out-soft);color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.check input{width:20px;height:20px;accent-color:var(--s);margin:0}
.done{opacity:var(--done)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .head h3{flex:1;min-width:0}
dl.kv{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
dl.kv dd{margin:0;min-width:0}
.out-list{display:grid;gap:4px;font-size:14px}
.out-list div{display:grid;grid-template-columns:40px 1fr;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.mapbox svg{width:100%;height:auto;display:block}
svg text{font-family:var(--display)}
.bt{cursor:pointer}
.raw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.raw img{max-width:none;width:900px;display:block}
blockquote{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.6}
.copy{font:600 14px var(--display);padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;justify-self:start}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:720px;margin:0 auto;display:grid;gap:6px}
.sheet .close{justify-self:end;font:600 14px var(--display);background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
.rvbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--muted);margin-top:8px}
.rv{display:inline-block;font:600 12px var(--display);letter-spacing:.04em;padding:1px 7px;border-radius:5px;border:1.5px solid currentColor;vertical-align:middle;white-space:nowrap}
.rv-PL{color:var(--rv-pl)}.rv-BE{color:var(--rv-be)}.rv-ANY{color:var(--muted)}
details summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1 id="pageTitle"></h1>
    <p class="sub" id="pageGoal"></p>
    <div class="rvbar" id="resumeBar"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-route" data-tab="route"></button>
    <button role="tab" id="tab-list" data-tab="list"></button>
    <button role="tab" id="tab-map" data-tab="map"></button>
    <button role="tab" id="tab-pitch" data-tab="pitch"></button>
  </nav>

  <!-- ROUTE -->
  <section class="panel" id="p-route" role="tabpanel">
    <div class="seg" id="routeSeg"></div>
    <p class="callout" id="routeNote"></p>
    <ol class="steps" id="routeSteps"></ol>
    <div class="group">
      <h2 id="onlineTitle"></h2>
      <p class="muted small" id="onlineIntro"></p>
      <ol class="steps" id="onlineSteps"></ol>
    </div>
  </section>

  <!-- LIST -->
  <section class="panel" id="p-list" role="tabpanel" hidden>
    <div class="legend" id="listLegend"></div>
    <div class="group" id="cards"></div>
    <div class="group">
      <h2 id="skippedTitle"></h2>
      <p class="muted small" id="skippedIntro"></p>
      <div class="out-list" id="outList"></div>
    </div>
  </section>

  <!-- MAP -->
  <section class="panel" id="p-map" role="tabpanel" hidden>
    <div class="seg" id="mapSeg"></div>
    <div class="legend" id="mapLegend"></div>
    <div class="mapbox"><svg id="hall" role="img"></svg></div>
    <p class="muted small" id="mapCaption"></p>
    <!-- Organizer's map: per career-fair.md step 8, embed the cropped original floor plan here, e.g.
         <details><summary>Organizer's map (the authority if the drawing disagrees)</summary>
           <div class="raw"><img src="map.png" alt="Organizer's floor plan"></div></details> -->
  </section>

  <!-- PITCH -->
  <section class="panel" id="p-pitch" role="tabpanel" hidden>
    <div id="pitches" style="display:grid;gap:18px"></div>
    <div class="group">
      <h2 id="secondTitle"></h2>
      <div class="group" id="secondList"></div>
    </div>
    <div class="group">
      <h2 id="askTitle"></h2>
      <ol class="plain" id="askList"></ol>
    </div>
    <div class="group">
      <h2 id="pressedTitle"></h2>
      <ul class="plain" id="pressedList"></ul>
    </div>
    <div class="group">
      <h2 id="notesTitle"></h2>
      <ul class="plain" id="notesList"></ul>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden><div class="inner" id="sheetInner"></div></div>

<script>
/* =====================================================================
   DATA BLOCK. To adapt this page for another fair, replace only the
   objects below; the rendering code after the END OF DATA line reads
   them and never names a specific employer.

   PAGE      header: title, goal line, resume counts, section intros
   LABELS    tab names and section headings
   TIERS     tier codes, display names and legend text (order = list order)
   PITCHES   one entry per resume version (key = code used in rv):
             label, title, text; the "goes with" line is derived
   HALL      floor geometry: first booth number, rows, booths per row,
             spacing, row gap, booth size, margins, label side per row,
             row names, entrance position and labels
   C         employers you plan to visit:
             {id, n, short?, b | booths[], t, role, why, rv, lead, ask, note?, onlineNote?}
             t is a TIERS key; t:"ON" puts it on the "apply online" list.
             Two records with the same booth = shared booth;
             booths:["104","105"] = one employer on two booths.
   OUT       skipped employers: {n, b | booths[], why}
   ROUTES    walking orders: {KEY: {label, note, steps:[{at, id|null, note}]}}
             (the first key is the default route)
   SECOND    per-booth second sentences: {ids[], rv, text, tip?}
   ASK       questions to ask every booth
   PRESSED   "if pressed" risks: {k, v}
   NOTES     free-form notes
   ===================================================================== */

const PAGE = {
  title: "Fair Day",
  goal: "Goal: full-time new grad (graduating June 2027) · backend and platform roles · arrive 1:00 PM, work the floor until 4:00 PM",
  resumes: [{rv:"PL", count:6}, {rv:"BE", count:10}],
  resumeNote: "(spares included)",
  onlineIntro: "Booths with a long queue that send everyone to the careers site. Apply tonight while the conversation is fresh.",
  skippedIntro: "The roster or the posting shows no matching role. Walk past unless the queue is empty."
};

const LABELS = {
  tabs: {route:"Route", list:"List", map:"Map", pitch:"Pitch"},
  online: "Apply online tonight",
  onlineWhen: "Tonight",
  applied: "Applied",
  done: "Done",
  skipped: "Skipped",
  mapRoute: "Route",
  routeOrder: "Circled number = route order",
  second: "Swap the second sentence per booth",
  ask: "Ask every booth",
  pressed: "If pressed",
  notes: "Notes",
  pitchUse: "Goes with",
  noRoster: "No company on the roster",
  sharesBooth: "Shares booth with",
  close: "Close",
  copy: "Copy", copied: "Copied", copyFallback: "Selected; copy manually",
  perRole: "Per role",
  kv: {role:"Role", rv:"Resume", lead:"Lead", ask:"Ask", note:"Note"}
};

const TIERS = {
  S:  {name:"S",       legend:"S Must talk"},
  A:  {name:"A",       legend:"A Worth a talk"},
  ON: {name:"Online",  legend:"Apply online"},
  B:  {name:"B",       legend:"B If time allows"},
  X:  {name:"Skipped", legend:"Skipped / no data"}
};

const PITCHES = {
  BE: {
    label: "Backend",
    title: "30-second pitch",
    text: "Hi, I'm Alex, an MS Computer Science student at Example State University graduating in June 2027, looking for new-grad backend roles. Last summer I interned at Northwind Freight, where I cut the quote API's p95 latency from 820 ms to 210 ms with a Redis cache and built an invoice reconciler in Go on Kafka. On my own I built Tidepool, a distributed job queue in Go that runs 5k jobs a second on three nodes."
  },
  PL: {
    label: "Platform",
    title: "30-second pitch",
    text: "Hi, I'm Alex, an MS Computer Science student at Example State University graduating in June 2027, looking for new-grad platform roles. I built Tidepool, a distributed job queue in Go with leader election and lease-based retries; it runs 5k jobs a second on three nodes. Last summer at Northwind Freight I cut a quote API's p95 latency from 820 ms to 210 ms with a Redis cache."
  }
};

const HALL = {
  first: 101,            // lowest booth number
  rows: 3,               // straight rows, numbered left to right
  perRow: 10,            // booths per row, numbered from the entrance end
  spacing: 40,           // between booth centres along a row
  rowGap: 120,           // between row centres
  booth: {w:34, h:30},
  margin: {x:90, top:40, bottom:30},
  labelSide: ["L","R","R"],          // which side of each row the employer name goes
  rowNames: ["left","middle","right"],
  entrance: {at:0.12, width:56, label:"Entrance"},   // at = fraction of hall width along the bottom wall
  farEnd: "Lounge (far end of the hall)"
};

const C = [
  {id:"contoso", n:"Contoso", b:"113", t:"S", role:"Backend Engineer, New Grad",
   why:"Event-streaming product; the new-grad team owns ingestion services. Strong domain fit with the Kafka reconciler.",
   rv:"BE", lead:"Backend version; second sentence on the Kafka reconciler",
   ask:"Is the new-grad role on the ingestion or the API team? Do you run interviews on site?"},
  {id:"fabrikam", n:"Fabrikam", b:"126", t:"S", role:"Platform Engineer, New Grad",
   why:"Internal platform team of about 15 that runs the job scheduler and service mesh. Closest match to platform roles.",
   rv:"PL", lead:"Platform version: Tidepool leader election and leases",
   ask:"What does the first six months on the platform team look like? Is the posting live?"},
  {id:"tailspin", n:"Tailspin", b:"108", t:"S", role:"Software Engineer I, Backend",
   why:"Logistics APIs with tight latency targets; the posting is live and lists Go.",
   rv:"BE", lead:"Backend version: the quote API cache result first",
   ask:"Which team is hiring new grads, and what is their latency budget?"},
  {id:"woodgrove", n:"Woodgrove", b:"117", t:"A", role:"Software Engineer, Payments",
   why:"Payments backend; reconciliation work is a direct match. Mid-size team.",
   rv:"BE", lead:"Backend version: Kafka invoice reconciler in Go",
   ask:"Is there an engineering team at this office?"},
  {id:"proseware", n:"Proseware", b:"122", t:"A", role:"Backend New Grad",
   why:"Small product company; posting is live. Engineers rotate across services in year one.",
   rv:"BE", lead:"Backend version, internship first",
   ask:"Is the new-grad role remote-friendly, or tied to one office?"},
  {id:"lucerne", n:"Lucerne", b:"129", t:"ON", role:"Cloud Infrastructure, University Grad",
   why:"Large company; queue is long and the booth takes no paper resumes. Strong platform fit.",
   rv:"PL", lead:"Online: Platform version",
   ask:"Don't queue. Apply online tonight.", onlineNote:"Use the Platform resume"},
  {id:"relecloud", n:"Relecloud", b:"111", t:"ON", role:"Software Engineer, Early Career",
   why:"Large company; queue is long, apply online. Both backend and infrastructure openings.",
   rv:"ANY", lead:"Online: Backend version for service roles, Platform version for infrastructure roles",
   ask:"Only if the queue is under 10 minutes: get a recruiter name. Otherwise apply online."},
  {id:"litware", n:"Litware", booths:["104","105"], t:"B", role:"Associate Engineer",
   why:"Double booth near the entrance. Role is mostly operations; a fallback.",
   rv:"BE", lead:"Backend version: internship",
   ask:"Any development-focused roles?"}
];

const OUT = [
  {n:"Coho",          b:"117", why:"Hardware roles only"},
  {n:"Wingtip",       b:"102", why:"Internships only"},
  {n:"Trey Research", b:"120", why:"Non-engineering roles only"},
  {n:"Alpine",        b:"124", why:"No office in your target area"},
  {n:"VanArsdel",     b:"115", why:"Posting closed before the fair"}
];

const ROUTES = {
  A: {label:"A Recommended",
      note:"Recommended. Queues at the large booths grow fastest after opening, so start with Tier S and leave the long queues for the end.",
      steps:[
        {at:"1:00", id:"tailspin",  note:"Closest Tier S to the entrance"},
        {at:"1:15", id:"contoso",   note:"May interview on site; allow 20 minutes"},
        {at:"1:35", id:"woodgrove", note:""},
        {at:"1:50", id:"fabrikam",  note:"Switch to the Platform resume"},
        {at:"2:05", id:"proseware", note:""},
        {at:"2:20", id:"litware",   note:"Only if the queue is short"},
        {at:"2:40", id:"relecloud", note:"Queue only if under 10 minutes"},
        {at:"3:15", id:null,        note:"Revisit the one or two best conversations; get cards, confirm next steps"}
      ]},
  B: {label:"B Short",
      note:"Only one hour left: Tier S in walking order, then one Tier A.",
      steps:[
        {at:"", id:"tailspin", note:""},
        {at:"", id:"contoso",  note:""},
        {at:"", id:"fabrikam", note:""},
        {at:"", id:"proseware", note:"If time remains"}
      ]}
};

const SECOND = [
  {ids:["contoso","woodgrove"], rv:"BE",
   text:"At Northwind Freight I also built a Kafka-based invoice reconciler in Go, so I've worked on the streaming side as well as request latency.",
   tip:"Mention you read their engineering blog before the fair, if you did."},
  {ids:["tailspin","proseware"], rv:"BE",
   text:"On the quote API the fix was a Redis cache in front of the slow path, which took p95 from 820 ms down to 210 ms."},
  {ids:["fabrikam","lucerne"], rv:"PL",
   text:"In Tidepool, a leader election picks one coordinator, and jobs are handed out on leases, so a job whose worker dies gets retried when the lease runs out."}
];

const ASK = [
  "Is the 2027 new-grad role posted yet, or when will it open? (Large companies usually answer \"apply online\"; ask, then move on.)",
  "What would a new grad work on in the first six months?",
  "Get the recruiter's name and email; log them in applications.md that evening."
];

const PRESSED = [
  {k:"Northwind Freight", v:"820 ms to 210 ms is the p95 of the quote API only, not the whole site. Say \"I\", not \"we\", only for the parts you built."},
  {k:"Tidepool", v:"5k jobs/s is on three nodes in your own benchmark. Don't extrapolate to more nodes."},
  {k:"Kafka reconciler", v:"Say what you built in Go; don't claim ownership of the Kafka cluster itself."}
];

const NOTES = [
  "The roster lists two employers at one booth; confirm on site which one is staffing it.",
  "Some postings come from aggregator sites and may already be closed; check the careers page before applying.",
  "Booth numbers come from the roster; the organizer's map is the authority if the drawing disagrees."
];

/* ===== END OF DATA. Rendering code below; no edits needed to adapt. ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const byId = Object.fromEntries(C.map(c=>[c.id,c]));
const TIER_KEYS = Object.keys(TIERS);
const tierRank = t => { const i = TIER_KEYS.indexOf(t); return i<0 ? TIER_KEYS.length : i; };
const ROUTE_KEYS = Object.keys(ROUTES);
const COLORVAR = {S:"var(--s)",A:"var(--a)",ON:"var(--on)",B:"var(--b)",X:"var(--out)"};
const colorOf = t => COLORVAR[t] || "var(--out)";

const boothsOf = r => (r.booths || [r.b]).map(String);
function boothText(r){
  const b = boothsOf(r);
  const consecutive = b.length>1 && b.every((x,i)=>i===0 || +x === +b[i-1]+1);
  return consecutive ? b[0]+"–"+b[b.length-1] : b.join(", ");
}

/* booth -> entries [{rec, t, skipped}] sorted best tier first */
const atBooth = {};
C.forEach(c=>boothsOf(c).forEach(b=>(atBooth[b] ||= []).push({rec:c, t:c.t, skipped:false})));
OUT.forEach(o=>boothsOf(o).forEach(b=>(atBooth[b] ||= []).push({rec:o, t:"X", skipped:true})));
Object.values(atBooth).forEach(list=>list.sort((x,y)=>tierRank(x.t)-tierRank(y.t)));
const sharers = c => [...new Set(boothsOf(c).flatMap(b=>atBooth[b]).filter(e=>e.rec!==c).map(e=>e.rec.n))];

let visited = {};
try { visited = JSON.parse(localStorage.getItem("fairday-visited")||"{}")||{}; } catch(e){ visited = {}; }
function saveVisited(){ try{ localStorage.setItem("fairday-visited", JSON.stringify(visited)); }catch(e){} }
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

const rvName = rv => PITCHES[rv] ? PITCHES[rv].label : LABELS.perRole;
const rvTag = rv => `<span class="rv rv-${PITCHES[rv]?esc(rv):"ANY"}">${esc(rvName(rv))}</span>`;
const boothTag = (r,t) => `<span class="booth t-${esc(t)}">${esc(boothText(r))}</span>`;
const checkbox = (key,label) => `<label class="check"><input type="checkbox" data-v="${esc(key)}" ${visited[key]?"checked":""} aria-label="${esc(label)}">${esc(label)}</label>`;
const legendHTML = extra => TIER_KEYS.map(t=>`<span><i class="t-${t}"></i>${esc(TIERS[t].legend)}</span>`).join("") + (extra?`<span>${esc(extra)}</span>`:"");

/* resume colours: one CSS token per pitch key, cycling through two hues */
(function rvStyles(){
  const hues = ["var(--rv-be)","var(--rv-pl)"];
  const css = Object.keys(PITCHES).map((k,i)=>`.rv-${k}{color:${hues[i%hues.length]}}`).join("");
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
})();

function renderStatic(){
  document.title = PAGE.title;
  $("pageTitle").textContent = PAGE.title;
  $("pageGoal").textContent = PAGE.goal;
  $("resumeBar").innerHTML = PAGE.resumes.map(r=>`<span class="rv rv-${esc(r.rv)}">${esc(rvName(r.rv))} resume</span>bring ${esc(r.count)}`).join(" · ") + (PAGE.resumeNote?" "+esc(PAGE.resumeNote):"");
  Object.entries(LABELS.tabs).forEach(([k,v])=>{ const b=$("tab-"+k); if(b) b.textContent=v; });
  $("onlineTitle").textContent = LABELS.online;
  $("onlineIntro").textContent = PAGE.onlineIntro;
  $("skippedTitle").textContent = LABELS.skipped;
  $("skippedIntro").textContent = PAGE.skippedIntro;
  $("listLegend").innerHTML = legendHTML();
  $("mapLegend").innerHTML = legendHTML(LABELS.routeOrder);
  const segCols = `repeat(${ROUTE_KEYS.length},1fr)`;
  $("routeSeg").style.gridTemplateColumns = segCols;
  $("mapSeg").style.gridTemplateColumns = segCols;
  $("routeSeg").innerHTML = ROUTE_KEYS.map(k=>`<button data-r="${esc(k)}">${esc(ROUTES[k].label)}</button>`).join("");
  $("mapSeg").innerHTML = ROUTE_KEYS.map(k=>`<button data-r="${esc(k)}">${esc(LABELS.mapRoute+" "+k)}</button>`).join("");
  $("secondTitle").textContent = LABELS.second;
  $("askTitle").textContent = LABELS.ask;
  $("pressedTitle").textContent = LABELS.pressed;
  $("notesTitle").textContent = LABELS.notes;
}

function renderPitch(){
  $("pitches").innerHTML = Object.entries(PITCHES).map(([k,p])=>{
    const users = C.filter(c=>c.rv===k).map(c=>c.n);
    return `<div class="group"><h2>${esc(p.title)} · ${rvTag(k)}</h2>`
      + (users.length?`<p class="muted small">${esc(LABELS.pitchUse)} the ${esc(p.label)} resume: ${esc(users.join(", "))}.</p>`:"")
      + `<blockquote id="pitch-${esc(k)}">${esc(p.text)}</blockquote><button class="copy" data-copy="pitch-${esc(k)}">${esc(LABELS.copy)}</button></div>`;
  }).join("");
  $("secondList").innerHTML = SECOND.map(s=>`<div class="card"><h3>${esc(s.ids.map(id=>byId[id]?byId[id].n:id).join(", "))} ${rvTag(s.rv)}</h3><p>${esc(s.text)}</p>${s.tip?`<p class="muted small">${esc(s.tip)}</p>`:""}</div>`).join("");
  $("askList").innerHTML = ASK.map(a=>`<li>${esc(a)}</li>`).join("");
  $("pressedList").innerHTML = PRESSED.map(p=>`<li><b>${esc(p.k)}:</b> ${esc(p.v)}</li>`).join("");
  $("notesList").innerHTML = NOTES.map(n=>`<li>${esc(n)}</li>`).join("");
}

let currentRoute = ROUTE_KEYS[0];
function renderRoute(r){
  if(!ROUTES[r]) r = ROUTE_KEYS[0];
  currentRoute = r;
  document.querySelectorAll("#routeSeg button,#mapSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.r===r));
  const R = ROUTES[r];
  $("routeNote").textContent = R.note;
  $("routeSteps").innerHTML = R.steps.map(({at,id,note})=>{
    const c = id && byId[id];
    if(!c) return `<li><span class="time">${esc(at||"")}</span><span class="stepname">${esc(note||"")}</span><span></span></li>`;
    return `<li class="${visited[id]?"done":""}" data-row="${esc(id)}"><span class="time">${esc(at||"↓")}</span><span class="stepname">${boothTag(c,c.t)}<b>${esc(c.n)}</b> ${rvTag(c.rv)}${note?`<br><span class="muted small">${esc(note)}</span>`:""}</span>${checkbox(id,LABELS.done)}</li>`;
  }).join("");
  pref("fairday-route", r);
  drawMap(r);
}

function renderOnline(){
  $("onlineSteps").innerHTML = C.filter(c=>c.t==="ON").map(c=>{
    const key = "online-"+c.id;
    return `<li class="${visited[key]?"done":""}" data-row="${esc(key)}"><span class="time">${esc(LABELS.onlineWhen)}</span><span class="stepname">${boothTag(c,c.t)}<b>${esc(c.n)}</b> ${rvTag(c.rv)}${c.onlineNote?`<br><span class="muted small">${esc(c.onlineNote)}</span>`:""}</span>${checkbox(key,LABELS.applied)}</li>`;
  }).join("");
}

function kvHTML(c){
  const K = LABELS.kv, share = sharers(c);
  const note = [c.note, share.length?`${LABELS.sharesBooth} ${share.join(", ")}`:""].filter(Boolean).join(". ");
  return `<dl class="kv"><dt>${esc(K.role)}</dt><dd>${esc(c.role||"")}</dd><dt>${esc(K.rv)}</dt><dd>${esc(rvName(c.rv))}</dd><dt>${esc(K.lead)}</dt><dd>${esc(c.lead||"")}</dd><dt>${esc(K.ask)}</dt><dd>${esc(c.ask||"")}</dd>${note?`<dt>${esc(K.note)}</dt><dd>${esc(note)}</dd>`:""}</dl>`;
}
function cardHead(c){ return `<div class="head">${boothTag(c,c.t)}<h3>${esc(c.n)}</h3><span class="chip c-${esc(c.t)}">${esc(TIERS[c.t]?TIERS[c.t].name:c.t)}</span>${rvTag(c.rv)}`; }
function cardHTML(c){
  return `<div class="card ${visited[c.id]?"done":""}" data-row="${esc(c.id)}">${cardHead(c)}${checkbox(c.id,LABELS.done)}</div><p>${esc(c.why||"")}</p>${kvHTML(c)}</div>`;
}
function renderList(){
  const sorted = [...C].sort((x,y)=>tierRank(x.t)-tierRank(y.t));
  $("cards").innerHTML = sorted.map(cardHTML).join("");
  $("outList").innerHTML = OUT.map(o=>`<div>${boothTag(o,"X")}<span><b>${esc(o.n)}</b> <span class="muted">· ${esc(o.why)}</span></span></div>`).join("");
}

/* ---- map: rows run up from the entrance wall; numbers rise away from the entrance ---- */
const hallW = HALL.margin.x*2 + (HALL.rows-1)*HALL.rowGap;
const hallH = HALL.margin.top + (HALL.perRow-1)*HALL.spacing + HALL.margin.bottom;
const lastBooth = HALL.first + HALL.rows*HALL.perRow - 1;
function boothPos(n){
  const idx = n - HALL.first, row = Math.floor(idx/HALL.perRow), i = idx % HALL.perRow;
  return {
    x: HALL.margin.x + row*HALL.rowGap,
    y: HALL.margin.top + (HALL.perRow-1-i)*HALL.spacing,
    w: HALL.booth.w, h: HALL.booth.h,
    side: HALL.labelSide[row] || "R", row
  };
}

function drawMap(r){
  const R = ROUTES[r] || ROUTES[ROUTE_KEYS[0]];
  const ex = hallW*HALL.entrance.at, ew = HALL.entrance.width/2;
  let s = "";
  // walls with an entrance gap in the bottom wall
  s += `<path d="M ${ex-ew} ${hallH} L 0 ${hallH} L 0 0 L ${hallW} 0 L ${hallW} ${hallH} L ${ex+ew} ${hallH}" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
  s += `<path d="M ${ex-ew+4} ${hallH} L ${ex-ew+4} ${hallH+18} M ${ex+ew-4} ${hallH} L ${ex+ew-4} ${hallH+18}" stroke="var(--accent)" stroke-width="2"/>`;
  s += `<text x="${ex}" y="${hallH+32}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">${esc(HALL.entrance.label)} ▲</text>`;
  s += `<text x="${hallW/2}" y="16" text-anchor="middle" font-size="10" fill="var(--muted)">▲ ${esc(HALL.farEnd)}</text>`;
  for(let n=HALL.first; n<=lastBooth; n++){
    const key = String(n), p = boothPos(n), list = atBooth[key], top = list && list[0];
    const known = !!top, fill = known ? colorOf(top.t) : "none";
    const isDone = top && !top.skipped && visited[top.rec.id];
    const names = list ? list.map(e=>e.rec.n).join(", ") : "";
    s += `<g class="bt" data-b="${key}" tabindex="0" role="button" aria-label="Booth ${key}${names?" "+esc(names):""}" opacity="${isDone?0.4:1}">`;
    s += `<rect x="${p.x-p.w/2}" y="${p.y-p.h/2}" width="${p.w}" height="${p.h}" rx="4" fill="${fill}" stroke="${known?fill:"var(--line)"}" stroke-width="1.5"/>`;
    s += `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${known?"#fff":"var(--muted)"}">${n}</text></g>`;
  }
  // labels: one per employer, on its first booth, if it is that booth's best-tier entry
  C.forEach(c=>{
    const b0 = boothsOf(c)[0], list = atBooth[b0];
    if(!list || list[0].rec!==c) return;
    const p = boothPos(+b0);
    const extra = list.length>1 ? ` +${list.length-1}` : "";
    const sfx = PITCHES[c.rv] ? " ·"+c.rv : "";
    const lx = p.side==="L" ? p.x-p.w/2-3 : p.x+p.w/2+3;
    s += `<text x="${lx}" y="${p.y+4}" text-anchor="${p.side==="L"?"end":"start"}" font-size="9.5" font-weight="600" fill="${colorOf(c.t)}">${esc((c.short||c.n)+sfx+extra)}</text>`;
  });
  // route badges on the corner opposite the label
  const seen = {};
  R.steps.filter(st=>st.id && byId[st.id]).forEach((st,i)=>{
    const b0 = boothsOf(byId[st.id])[0], p = boothPos(+b0), k = seen[b0] = (seen[b0]||0)+1;
    const bx = p.side==="L" ? p.x+p.w/2 : p.x-p.w/2, by = p.y-p.h/2 + (k-1)*18;
    s += `<circle cx="${bx}" cy="${by}" r="8.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"/><text x="${bx}" y="${by+3.8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bg)">${i+1}</text>`;
  });
  const svg = $("hall");
  svg.setAttribute("viewBox", `-4 -4 ${hallW+8} ${hallH+44}`);
  const side = HALL.entrance.at < 0.34 ? "left" : HALL.entrance.at > 0.66 ? "right" : "centre";
  svg.setAttribute("aria-label", `Hall floor plan, ${HALL.entrance.label.toLowerCase()} at the bottom ${side}`);
  svg.innerHTML = s;
  svg.querySelectorAll(".bt").forEach(g=>{
    const open = ()=>showSheet(g.dataset.b);
    g.addEventListener("click", open);
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }});
  });
}

function mapCaption(){
  const rowsTxt = Array.from({length:HALL.rows},(_,r)=>{
    const a = HALL.first + r*HALL.perRow, z = a + HALL.perRow - 1;
    return `${a}–${z} ${HALL.rowNames[r]||"row "+(r+1)}`;
  }).join(", ");
  $("mapCaption").textContent = `Drawn with the ${HALL.entrance.label.toLowerCase()} at the bottom: booths ${rowsTxt}, numbers rising away from the ${HALL.entrance.label.toLowerCase()}. Not to scale. Tap a booth for notes.`;
}

function showSheet(b){
  const list = atBooth[b] || [], el = $("sheetInner");
  if(!list.length){
    el.innerHTML = `<p><span class="booth t-X">${esc(b)}</span><b>${esc(LABELS.noRoster)}</b></p>`;
  } else {
    el.innerHTML = list.map(e=> e.skipped
      ? `<p>${boothTag(e.rec,"X")}<b>${esc(e.rec.n)}</b> <span class="muted">· ${esc(LABELS.skipped)}: ${esc(e.rec.why)}</span></p>`
      : `<div class="card" style="border:none;padding:0">${cardHead(e.rec)}</div><p class="small">${esc(e.rec.why||"")}</p>${kvHTML(e.rec)}</div>`
    ).join("");
  }
  el.innerHTML += `<button class="close" id="sheetClose">${esc(LABELS.close)}</button>`;
  $("sheet").hidden = false;
  $("sheetClose").addEventListener("click", ()=>{ $("sheet").hidden = true; });
}

const TABS = Object.keys(LABELS.tabs);
function setTab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  TABS.forEach(x=>{ $("p-"+x).hidden = x!==t; });
  $("sheet").hidden = true;
  pref("fairday-tab", t);
}

renderStatic(); renderPitch(); renderList(); renderOnline(); mapCaption();
renderRoute(pref("fairday-route")||ROUTE_KEYS[0]);

document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ setTab(b.dataset.tab); window.scrollTo({top:0}); }));
document.querySelectorAll("#routeSeg button,#mapSeg button").forEach(b=>b.addEventListener("click",()=>renderRoute(b.dataset.r)));

document.addEventListener("change", e=>{
  const v = e.target.dataset && e.target.dataset.v; if(!v) return;
  visited[v] = e.target.checked; saveVisited();
  document.querySelectorAll("[data-row]").forEach(row=>{ if(row.dataset.row===v) row.classList.toggle("done", e.target.checked); });
  document.querySelectorAll("input[data-v]").forEach(i=>{ if(i.dataset.v===v) i.checked = e.target.checked; });
  drawMap(currentRoute);
});

document.querySelectorAll("button[data-copy]").forEach(btn=>btn.addEventListener("click",()=>{
  const el = $(btn.dataset.copy), txt = el.textContent;
  const fallback = ()=>{ const rg=document.createRange(); rg.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); btn.textContent=LABELS.copyFallback; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ btn.textContent=LABELS.copied; }, fallback); }catch(e){ fallback(); }
}));

const hashTab = (location.hash||"").replace("#","");
const savedTab = pref("fairday-tab");
setTab(TABS.includes(hashTab) ? hashTab : (TABS.includes(savedTab) ? savedTab : TABS[0]));
</script>
